# ==========================================
# 🚀 RENDER BLUEPRINT - MyQuest API
# ==========================================
#
# Déploie l'API backend sur Render.
# La DB PostgreSQL existe déjà sur Render.
#
# APRÈS DÉPLOIEMENT:
# 1. Va dans Render Dashboard > myquest-api > Environment
# 2. Ajoute DATABASE_URL avec ta connection string existante

services:
  - type: web
    name: myquest-api
    runtime: node
    region: frankfurt
    plan: free
    
    # Dossier backend
    rootDir: backend
    
    # Build: install (avec devDeps pour TypeScript) + prisma + compile
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    
    # Start
    startCommand: npm start
    
    # Health check
    healthCheckPath: /health
    
    # Variables d'environnement
    envVars:
      - key: NODE_ENV
        value: production
      
      # JWT_SECRET généré automatiquement
      - key: JWT_SECRET
        generateValue: true
      
      # DATABASE_URL - à configurer manuellement dans Render Dashboard
      # Va dans Environment > Add Environment Variable
      # Clé: DATABASE_URL
      # Valeur: postgresql://myquest_user:xxxxx@dpg-xxxxx.frankfurt-postgres.render.com/myquest_vurb
    
    # Auto-deploy sur push main
    autoDeploy: true
    branch: main

  # Frontend (Static Site)
  - type: web
    name: myquest-web
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    branch: main
